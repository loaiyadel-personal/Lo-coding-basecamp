  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:      #080f1e;
      --ink-mid:  #18253a;
      --muted:    #5a7190;
      --subtle:   #8fa4be;
      --border:   #dde5f0;
      --bg:       #f5f8fc;
      --surface:  #ffffff;
      --sky:      #0272c0;
      --sky-light:#dbeeff;
      --sky-hover:#015fa3;
      --sh-md: 0 4px 20px rgba(8,15,30,0.09), 0 2px 6px rgba(8,15,30,0.05);
      --r-lg: 16px;
      --r-full: 9999px;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--sh-md);
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 100%;
    }

    .code {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 5rem;
      font-weight: 700;
      line-height: 1;
      color: var(--sky);
      letter-spacing: -2px;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: .6rem;
    }

    p {
      font-size: .95rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      background: var(--sky);
      color: #fff;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 600;
      text-decoration: none;
      padding: .7rem 1.5rem;
      border-radius: var(--r-full);
      transition: background 140ms ease, transform 140ms ease;
    }
    .btn:hover { background: var(--sky-hover); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn svg {
      width: 15px; height: 15px;
      stroke: currentColor; fill: none;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0 1.5rem;
    }

    .brand {
      font-size: .8rem;
      color: var(--subtle);
      font-weight: 500;
    }
    .brand span { color: var(--ink-mid); font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">

    <hr class="divider">
    <div class="brand"><span>Loaiy Adel</span> · Senior Scrum Master</div>
  </div>
</body>
</html>
